model:
  channels:
  - 4
  - 8
  - 12
  - 16
  fusion_channels: 8
  d_state: 4
  expand: 1
  scan_backend: reference
data:
  root: data/synthetic
  image_size: 64
  clahe: true
  clahe_clip: 2.0
  clahe_grid: 8
  hflip_p: 0.5
  vflip_p: 0.5
  rotate_p: 0.5
  rotate_degrees: 15
  mosaic_p: 0.5
  mixup_p: 0.2
  mixup_alpha: 0.5
train:
  device: cpu
  epochs: 2
  batch_size: 1
  workers: 0
  seed: 42
  amp: false
  lr: 0.001
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
  amsgrad: false
  t_max: 50
  eta_min: 1.0e-05
  log_interval: 1
  val_interval: 1
  save_interval: 1
  cpu_threads: 2
eval:
  threshold: 0.5
  threshold_start: 0.01
  threshold_end: 0.99
  threshold_step: 0.01
